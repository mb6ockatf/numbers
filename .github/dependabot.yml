# This file is free software; see COPYING for copying conditions.
#
# All updates arrive grouped in one weekly pull request.  The container
# image named in ci.yml (gcc:16.2-trixie) is not covered.

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
